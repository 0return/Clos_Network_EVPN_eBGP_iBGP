    network-instance default {
        type default
        admin-state enable
        interface ethernet-1/1.0 {
        }
        interface ethernet-1/2.0 {
        }
        interface system0.0 {
        }
        protocols {
            bgp {
                admin-state enable
                autonomous-system 65002
                router-id 100.0.2.2
                afi-safi ipv4-unicast {
                    admin-state enable
                }
                group evpnRR {
                    peer-as 65000
                    afi-safi evpn {
                        admin-state enable
                    }
                    afi-safi ipv4-unicast {
                        admin-state disable
                    }
                    local-as {
                        as-number 65000
                    }
                }
                group spines {
                    peer-as 64999
                    export-policy [
                        exportIP
                    ]
                    import-policy [
                        importIPs
                    ]
                }
                neighbor 10.1.2.2 {
                    peer-group spines
                }
                neighbor 10.2.2.2 {
                    peer-group spines
                }
                neighbor 100.0.1.1 {
                    peer-group evpnRR
                }
                neighbor 100.0.1.2 {
                    peer-group evpnRR
                }
            }
        }
    }
    network-instance mgmt {
        type ip-vrf
        admin-state enable
        description "Management network instance"
        interface mgmt0.0 {
        }
        protocols {
            linux {
                import-routes true
                export-routes true
                export-neighbors true
            }
        }
    }
    interface ethernet-1/1 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 10.1.2.1/24 {
                }
            }
        }
    }
    interface ethernet-1/2 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 10.2.2.1/24 {
                }
            }
        }
    }
    interface ethernet-1/3 {
        admin-state enable
    }
    interface mgmt0 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                dhcp-client {
                }
            }
            ipv6 {
                admin-state enable
                dhcp-client {
                }
            }
        }
    }
    interface system0 {
        admin-state enable
        subinterface 0 {
            admin-state enable
            ipv4 {
                admin-state enable
                address 100.0.2.2/32 {
                }
            }
        }
    }
    routing-policy {
        prefix-set My_System_IP {
            prefix 100.0.2.2/32 mask-length-range 32..32 {
            }
        }
        prefix-set SystemIPs {
            prefix 100.0.0.0/16 mask-length-range 32..32 {
            }
        }
        policy exportIP {
            default-action {
                policy-result reject
            }
            statement 10 {
                match {
                    prefix {
                        prefix-set My_System_IP
                    }
                }
                action {
                    policy-result accept
                }
            }
        }
        policy importIPs {
            default-action {
                policy-result reject
            }
            statement 10 {
                match {
                    prefix {
                        prefix-set SystemIPs
                    }
                }
                action {
                    policy-result accept
                }
            }
        }
    }
